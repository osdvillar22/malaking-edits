<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Malaking Edits</title>
<style>
  :root {
    --bg: #f4f4f5; --panel: #ffffff; --text: #18181b; --muted: #71717a;
    --border: #e4e4e7; --accent: #2563eb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --panel: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
      --border: #27272a; --accent: #3b82f6; --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  button, .btn {
    font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
    user-select: none; -webkit-user-select: none;
  }
  button:hover:not(:disabled), .btn:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* Upload screen */
  #drop {
    flex: 1; margin: 16px; border: 2px dashed var(--border); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 24px; cursor: pointer;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop p { margin: 0; color: var(--muted); max-width: 420px; }
  #drop .big { font-size: 20px; color: var(--text); font-weight: 600; }

  /* Progress */
  #busy {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  #busy .card {
    background: var(--panel); border-radius: 14px; padding: 20px 24px; width: min(360px, 100%);
    text-align: center;
  }
  #busy .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  #busy .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #busy small { display: block; color: var(--muted); margin-top: 8px; }

  /* Editor */
  #editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #editor.empty #stage, #editor:not(.empty) #drop { display: none; }
  #editor.empty .toolbar, #editor.empty .bottombar { opacity: .45; pointer-events: none; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .sep { width: 1px; height: 26px; background: var(--border); }
  .toolbar label, .bglabel { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .toolbar input[type=range] { width: 100px; }
  #stage { flex: 1; overflow: auto; min-height: 0; display: flex; padding: 16px; }
  #wrap { margin: auto; position: relative; flex: none; box-shadow: 0 0 0 1px rgba(128,128,128,.35); }
  #wrap.checker, .swatch.checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #d4d4d8 25%, transparent 25%), linear-gradient(-45deg, #d4d4d8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d4d4d8 75%), linear-gradient(-45deg, transparent 75%, #d4d4d8 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  .swatch.checker { background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0; }
  #wrap { touch-action: none; }
  #canvas { display: block; position: absolute; }
  #bgView { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  #wrap > .orig { position: absolute; pointer-events: none; visibility: hidden; z-index: 2; }
  #wrap.comparing > .orig { visibility: visible; }
  #stage.tool-move #wrap { cursor: grab; }
  #stage.tool-magic #wrap { cursor: crosshair; }
  #stage.tool-erase #wrap, #stage.tool-restore #wrap { cursor: none; }
  #expandBtn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #expandPanel { display: none; }
  #expandPanel.open { display: flex; }
  .anchor { display: grid; grid-template-columns: repeat(3, 18px); gap: 3px; }
  .anchor button { width: 18px; height: 18px; min-height: 0; padding: 0; border-radius: 4px; }
  .anchor button.active { background: var(--accent); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; flex-basis: 100%; }
  #cursor {
    position: fixed; pointer-events: none; border-radius: 50%; display: none; z-index: 5;
    border: 1.5px solid #fff; box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000;
  }
  #compareBtn.active { background: #f59e0b; border-color: #f59e0b; color: #000; }
  .bottombar {
    display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border);
  }
  .bottombar .info { color: var(--muted); font-size: 12px; }
  .swatch {
    width: 30px; height: 30px; padding: 0; min-height: 0; border-radius: 50%;
    overflow: hidden; position: relative;
  }
  .swatch.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatch input[type=color] { position: absolute; inset: -8px; width: 50px; height: 50px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
  #bgColorSwatch { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .pill { min-height: 30px; padding: 4px 10px; font-size: 13px; }
  .pill.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #18181b; color: #fff;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  @media (max-width: 640px) {
    .toolbar { padding: 8px; gap: 6px; }
    .sep { display: none; }
    .toolbar input[type=range] { width: 80px; }
    button { padding: 7px 10px; }
    .hide-sm { display: none; }
    .bottombar { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Malaking Edits</h1>
  <button id="newBtn" style="display:none">New photo</button>
</header>

<main>
  <input id="file" type="file" accept="image/*" hidden>
  <section id="editor" class="empty">
    <div class="toolbar">
      <button id="removeBgBtn" class="primary" title="Remove the background with AI">✨ Remove background</button>
      <div class="sep"></div>
      <div class="group">
        <button id="toolErase" title="Erase leftover background (E)">Erase</button>
        <button id="toolMagic" title="Tap a leftover patch to erase similar connected colors (M)">Magic</button>
        <button id="toolRestore" title="Paint back parts of the original photo (R)">Restore</button>
        <button id="toolMove" class="active" title="Drag to move around when zoomed in (hold Space)">Move</button>
      </div>
      <div class="sep"></div>
      <div class="group" id="brushOpts" style="display:none">
        <label>Size <input id="size" type="range" min="4" max="150" value="30"></label>
        <label>Softness <input id="soft" type="range" min="0" max="100" value="40"></label>
      </div>
      <div class="group" id="magicOpts" style="display:none">
        <label>Tolerance <input id="tol" type="range" min="1" max="80" value="20"></label>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomFit" title="Fit to screen">Fit</button>
        <button id="zoomIn" title="Zoom in">+</button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" disabled title="Redo (Ctrl+Y)">Redo</button>
        <button id="compareBtn" title="Press and hold to see the original photo (hold C)">Hold to compare</button>
        <button id="expandBtn" title="Add space around the photo">Expand</button>
      </div>
    </div>

    <div class="toolbar" id="expandPanel">
      <div class="group">
        <span class="bglabel">Shape</span>
        <button class="pill active" data-ratio="orig">Original</button>
        <button class="pill" data-ratio="1:1">1:1</button>
        <button class="pill" data-ratio="4:5">4:5</button>
        <button class="pill" data-ratio="9:16">9:16</button>
        <button class="pill" data-ratio="16:9">16:9</button>
        <button class="pill" data-ratio="4:3">4:3</button>
        <button class="pill" data-ratio="3:2">3:2</button>
      </div>
      <div class="sep"></div>
      <label>Border / extra space <input id="pad" type="range" min="0" max="60" value="0"></label>
      <div class="sep"></div>
      <div class="group">
        <span class="bglabel">Position</span>
        <div class="anchor" id="anchor"></div>
      </div>
      <div class="sep"></div>
      <div class="group">
        <span class="bglabel">Extend photo by</span>
        <button class="pill active" data-ext="mirror">Mirror</button>
        <button class="pill" data-ext="stretch">Stretch</button>
      </div>
      <button class="pill" id="expandReset">Reset</button>
      <span class="hint">The new space is filled with the Background chosen below — e.g. <b>1:1</b> + <b>White</b> makes a square photo with white space. Pick <b>Original</b> to extend the photo's own background.</span>
    </div>

    <label id="drop" for="file">
      <div class="big">Tap or drop a photo here</div>
      <p>Everything happens on your device. Your photo is never uploaded or stored anywhere.</p>
      <p><small>Remove the background, erase, add a border or expand to a square — pick the tools you need.</small></p>
    </label>

    <div id="stage" class="tool-move">
      <div id="wrap" class="checker">
        <canvas id="bgView"></canvas>
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div class="bottombar">
      <div class="group">
        <span class="bglabel">Background</span>
        <button class="swatch checker active" data-bg="transparent" title="Transparent" aria-label="Transparent"></button>
        <button class="swatch" data-bg="color" data-color="#ffffff" style="background:#fff" title="White" aria-label="White"></button>
        <button class="swatch" data-bg="color" data-color="#000000" style="background:#000" title="Black" aria-label="Black"></button>
        <button class="swatch" id="bgColorSwatch" data-bg="custom" title="Pick any color" aria-label="Pick a color">
          <input type="color" id="bgColor" value="#3b82f6">
        </button>
        <button class="pill" data-bg="original" title="Keep the photo's own background (extended when you use Expand)">Original</button>
        <button class="pill" data-bg="blur" title="Blurred version of the original background">Blur</button>
        <button class="pill" data-bg="photo" title="Use another photo as the background">Photo…</button>
        <input type="file" id="bgFile" accept="image/*" hidden>
      </div>
      <div class="group">
        <span class="info" id="info"></span>
        <button id="shareBtn" style="display:none">Share / Save to Photos</button>
        <button id="downloadBtn" class="primary">Download PNG</button>
      </div>
    </div>
  </section>
</main>

<div id="cursor"></div>
<div id="toast"></div>
<div id="busy"><div class="card">
  <div id="busyText">Removing background…</div>
  <div class="bar"><div id="busyBar"></div></div>
  <small id="busySub"></small>
</div></div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), editor = $("editor"), stage = $("stage"), wrap = $("wrap");
const canvas = $("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
const bgView = $("bgView"), bgCtx = bgView.getContext("2d");
const cursorEl = $("cursor");

let original = null;      // canvas holding the original photo at full size (also used as the compare overlay)
let fileBase = "image";
let tool = "move";
let zoom = 1;             // 1 = fit to screen
let bg = { type: "transparent" };
let bgPhoto = null;
let doc = { w: 0, h: 0, ox: 0, oy: 0 };   // output size and where the photo sits inside it
const expand = { ratio: "orig", pad: 0, ax: 0.5, ay: 0.5, ext: "mirror" };
const undoStack = [], redoStack = [];
const MAX_HISTORY = 15;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.opacity = 0), 1800);
}

// ---------- Upload ----------
fileInput.addEventListener("change", () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); fileInput.value = ""; });
// Drop a photo anywhere on the page, any time
["dragenter", "dragover"].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
$("newBtn").addEventListener("click", () => fileInput.click());

function loadImage(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}
async function loadFile(file) {
  const url = URL.createObjectURL(file);
  try { return await loadImage(url); } finally { URL.revokeObjectURL(url); }
}

function showBusy(on, text = "Removing background…") {
  $("busy").style.display = on ? "flex" : "none";
  $("busyText").textContent = text; $("busyBar").style.width = "0"; $("busySub").textContent = "";
}

async function handleFile(file) {
  if (!file.type.startsWith("image/")) { alert("Please choose an image file."); return; }
  try {
    // Load the original with the phone's rotation already applied
    const img = await loadFile(file);
    const w = img.naturalWidth, h = img.naturalHeight;
    const orig = document.createElement("canvas");
    orig.width = w; orig.height = h; orig.className = "orig";
    orig.getContext("2d").drawImage(img, 0, 0);

    fileBase = file.name.replace(/\.[^.]+$/, "") || "image";
    original?.remove();
    original = orig;
    wrap.appendChild(original);
    cutout = null; removed = false;
    canvas.width = w; canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(original, 0, 0);

    undoStack.length = redoStack.length = 0; updateHistoryButtons();
    editor.classList.remove("empty"); $("newBtn").style.display = "";
    setTool("move");
    resetExpand();
  } catch (err) {
    console.error(err);
    alert("Couldn't open that image: " + (err?.message || err));
  }
}

// ---------- Remove background (only when asked) ----------
let cutout = null;     // cached AI result for the current photo
let removed = false;   // whether the canvas currently holds the AI cutout
$("removeBgBtn").onclick = async () => {
  if (!original) return;
  showBusy(true);
  try {
    if (!cutout) {
      // Send the already-oriented pixels so the mask lines up exactly
      const srcBlob = await new Promise((r) => original.toBlob(r, "image/png"));
      const resultBlob = await removeBackground(srcBlob, {
      model: "isnet_fp16",
      output: { format: "image/png", quality: 1 },
      progress: (key, cur, total) => {
        if (key.startsWith("fetch")) {
          $("busyText").textContent = "Downloading AI model (first time only)…";
          $("busyBar").style.width = Math.round((cur / total) * 100) + "%";
          $("busySub").textContent = `${(cur / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
        } else {
          $("busyText").textContent = "Removing background…";
          $("busyBar").style.width = total ? Math.round((cur / total) * 100) + "%" : "60%";
          $("busySub").textContent = "";
        }
      },
    });
      cutout = await loadFile(resultBlob);
    }
    pushUndo();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(cutout, 0, 0, canvas.width, canvas.height);
    removed = true;
    afterEdit();
    if (tool === "move") setTool("erase");
    toast("Background removed. Use Erase / Magic / Restore to touch up");
  } catch (err) {
    console.error(err);
    alert("Something went wrong: " + (err?.message || err));
  } finally {
    showBusy(false);
  }
};

// ---------- Zoom ----------
function fitScale() {
  const pad = 32;
  const sw = stage.clientWidth - pad, sh = stage.clientHeight - pad;
  return Math.min(sw / doc.w, sh / doc.h, 1);
}
function applyZoom(anchor) {
  const prev = wrap.getBoundingClientRect();
  const s = fitScale() * zoom;
  wrap.style.width = doc.w * s + "px";
  wrap.style.height = doc.h * s + "px";
  for (const el of [canvas, original]) {
    Object.assign(el.style, {
      left: doc.ox * s + "px", top: doc.oy * s + "px",
      width: canvas.width * s + "px", height: canvas.height * s + "px",
    });
  }
  // keep the point under the anchor roughly in place
  if (anchor && prev.width) {
    const rx = (anchor.x - prev.left) / prev.width, ry = (anchor.y - prev.top) / prev.height;
    const now = wrap.getBoundingClientRect();
    stage.scrollLeft += (now.left + rx * now.width) - anchor.x;
    stage.scrollTop += (now.top + ry * now.height) - anchor.y;
  }
}
function setZoom(z, anchor) { zoom = Math.max(1, Math.min(z, 16)); applyZoom(anchor); }
$("zoomIn").onclick = () => setZoom(zoom * 1.5);
$("zoomOut").onclick = () => setZoom(zoom / 1.5);
$("zoomFit").onclick = () => setZoom(1);
window.addEventListener("resize", () => original && applyZoom());
stage.addEventListener("wheel", (e) => {
  if (!original || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), { x: e.clientX, y: e.clientY });
}, { passive: false });

// ---------- Tools ----------
function setTool(t) {
  tool = t;
  for (const [id, name] of [["toolErase", "erase"], ["toolMagic", "magic"], ["toolRestore", "restore"], ["toolMove", "move"]])
    $(id).classList.toggle("active", name === t);
  stage.className = "tool-" + t;
  $("brushOpts").style.display = t === "erase" || t === "restore" ? "" : "none";
  $("magicOpts").style.display = t === "magic" ? "" : "none";
  if (t !== "erase" && t !== "restore") cursorEl.style.display = "none";
}
$("toolErase").onclick = () => setTool("erase");
$("toolMagic").onclick = () => setTool("magic");
$("toolRestore").onclick = () => setTool("restore");
$("toolMove").onclick = () => setTool("move");

// ---------- Compare (hold to see original) ----------
const cmp = $("compareBtn");
const setCompare = (on) => { wrap.classList.toggle("comparing", on); cmp.classList.toggle("active", on); };
cmp.addEventListener("pointerdown", (e) => { e.preventDefault(); cmp.setPointerCapture(e.pointerId); setCompare(true); });
["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => cmp.addEventListener(ev, () => setCompare(false)));
cmp.addEventListener("contextmenu", (e) => e.preventDefault());

// ---------- Background ----------
function drawCover(target, img) {
  const w = target.width, h = target.height, c = target.getContext("2d");
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(w / iw, h / ih);
  c.drawImage(img, (w - iw * s) / 2, (h - ih * s) / 2, iw * s, ih * s);
}
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function blurred(src, amount) {
  // Blur by shrinking then enlarging in steps (works in every browser, including iPhone Safari)
  const w = src.width, h = src.height;
  let cur = src, cw = w, ch = h;
  const target = Math.max(8, Math.round(Math.max(w, h) / amount));
  while (Math.max(cw, ch) / 2 >= target) {
    cw = Math.max(1, Math.round(cw / 2)); ch = Math.max(1, Math.round(ch / 2));
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(cur, 0, 0, cw, ch);
    cur = c;
  }
  while (cw * 2 < w) {
    cw *= 2; ch *= 2;
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(cur, 0, 0, cw, ch);
    cur = c;
  }
  const out = makeCanvas(w, h), x = out.getContext("2d");
  x.imageSmoothingQuality = "high";
  x.drawImage(cur, 0, 0, w, h);
  return out;
}
// The photo with the subject removed and the hole filled with surrounding colors
// (shrink step by step, then fill each level's holes from the smaller one)
function backgroundPlate() {
  const levels = [makeCanvas(original.width, original.height)];
  const x0 = levels[0].getContext("2d");
  x0.drawImage(original, 0, 0);
  if (!removed) return levels[0];
  x0.globalCompositeOperation = "destination-out";
  // remove a slightly larger area than the subject so its soft edges don't bleed into the fill
  const d = Math.max(2, Math.round(Math.max(original.width, original.height) * 0.012));
  for (const [dx, dy] of [[0, 0], [d, 0], [-d, 0], [0, d], [0, -d], [d, d], [-d, -d], [d, -d], [-d, d]])
    x0.drawImage(canvas, dx, dy);
  while (Math.max(levels.at(-1).width, levels.at(-1).height) > 4) {
    const p = levels.at(-1), c = makeCanvas(Math.ceil(p.width / 2), Math.ceil(p.height / 2));
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
    x.drawImage(p, 0, 0, c.width, c.height);
    levels.push(c);
  }
  for (let i = levels.length - 2; i >= 0; i--) {
    const x = levels[i].getContext("2d");
    x.globalCompositeOperation = "destination-over"; x.imageSmoothingQuality = "high";
    x.drawImage(levels[i + 1], 0, 0, levels[i].width, levels[i].height);
  }
  return levels[0];
}
// The original photo, extended into the new space by mirroring or stretching its background
function drawExtendedOriginal() {
  const w = original.width, h = original.height, { ox, oy } = doc;
  const L = ox, T = oy, R = doc.w - ox - w, B = doc.h - oy - h;
  if (L || T || R || B) {
    const o = backgroundPlate();
    const ext = makeCanvas(doc.w, doc.h), x = ext.getContext("2d");
    if (expand.ext === "mirror") {
      for (let i = -Math.ceil(L / w); i <= Math.ceil(R / w); i++) {
        for (let j = -Math.ceil(T / h); j <= Math.ceil(B / h); j++) {
          x.save();
          x.translate(ox + i * w + (i % 2 ? w : 0), oy + j * h + (j % 2 ? h : 0));
          x.scale(i % 2 ? -1 : 1, j % 2 ? -1 : 1);
          x.drawImage(o, 0, 0);
          x.restore();
        }
      }
    } else {
      const strips = [
        [0, 0, 1, h, 0, oy, L, h], [w - 1, 0, 1, h, ox + w, oy, R, h],
        [0, 0, w, 1, ox, 0, w, T], [0, h - 1, w, 1, ox, oy + h, w, B],
        [0, 0, 1, 1, 0, 0, L, T], [w - 1, 0, 1, 1, ox + w, 0, R, T],
        [0, h - 1, 1, 1, 0, oy + h, L, B], [w - 1, h - 1, 1, 1, ox + w, oy + h, R, B],
      ];
      for (const [sx, sy, sw, sh, dx, dy, dw, dh] of strips) if (dw > 0 && dh > 0) x.drawImage(o, sx, sy, sw, sh, dx, dy, dw, dh);
      x.drawImage(o, ox, oy);
    }
    bgCtx.drawImage(blurred(ext, 20), 0, 0);
  }
  // Crisp photo on top, with its edges faded into the extension so there is no hard seam
  const crisp = makeCanvas(w, h), c = crisp.getContext("2d");
  c.drawImage(original, 0, 0);
  const f = Math.max(2, Math.round(Math.min(w, h) * 0.05));
  c.globalCompositeOperation = "destination-out";
  const fade = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = c.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(rx, ry, rw, rh);
  };
  if (L) fade(0, 0, f, 0, 0, 0, f, h);
  if (R) fade(w, 0, w - f, 0, w - f, 0, f, h);
  if (T) fade(0, 0, 0, f, 0, 0, w, f);
  if (B) fade(0, h, 0, h - f, 0, h - f, w, f);
  bgCtx.drawImage(crisp, ox, oy);
}
function renderBackground() {
  wrap.classList.toggle("checker", bg.type === "transparent");
  wrap.style.background = bg.type === "color" ? bg.color : "";
  const usesCanvas = bg.type === "blur" || bg.type === "photo" || bg.type === "original";
  bgView.style.display = usesCanvas ? "block" : "none";
  if (!original || !usesCanvas) return;
  if (bgView.width !== doc.w || bgView.height !== doc.h) { bgView.width = doc.w; bgView.height = doc.h; }
  bgCtx.clearRect(0, 0, doc.w, doc.h);
  if (bg.type === "blur") {
    const c = makeCanvas(doc.w, doc.h); drawCover(c, backgroundPlate());
    bgCtx.drawImage(blurred(c, 48), 0, 0);
  } else if (bg.type === "photo") drawCover(bgView, bgPhoto);
  else drawExtendedOriginal();
}

// ---------- Expand ----------
function layout() {
  const w = canvas.width, h = canvas.height;
  let W = w, H = h;
  if (expand.ratio !== "orig") {
    const [a, b] = expand.ratio.split(":").map(Number), r = a / b;
    if (w / h < r) W = Math.round(h * r); else H = Math.round(w / r);
  }
  if (expand.ratio === "orig") {
    // even border on all sides (like a photo frame)
    const b = Math.round(Math.max(W, H) * expand.pad / 100);
    W += b; H += b;
  } else {
    W = Math.round(W * (1 + expand.pad / 100)); H = Math.round(H * (1 + expand.pad / 100));
  }
  doc = { w: W, h: H, ox: Math.round((W - w) * expand.ax), oy: Math.round((H - h) * expand.ay) };
  const grown = W !== w || H !== h;
  $("info").textContent = `${W} × ${H} px` + (grown ? ` (photo ${w} × ${h})` : "");
  renderBackground();
  applyZoom();
}
function resetExpand() {
  Object.assign(expand, { ratio: "orig", pad: 0, ax: 0.5, ay: 0.5 });
  $("pad").value = 0;
  document.querySelectorAll("[data-ratio]").forEach((b) => b.classList.toggle("active", b.dataset.ratio === "orig"));
  document.querySelectorAll("#anchor button").forEach((b) => b.classList.toggle("active", b.dataset.ax === "0.5" && b.dataset.ay === "0.5"));
  zoom = 1; layout();
}
for (const ay of [0, 0.5, 1]) for (const ax of [0, 0.5, 1]) {
  const b = document.createElement("button");
  b.dataset.ax = ax; b.dataset.ay = ay; b.setAttribute("aria-label", `Position ${ax},${ay}`);
  b.onclick = () => {
    expand.ax = ax; expand.ay = ay;
    document.querySelectorAll("#anchor button").forEach((x) => x.classList.toggle("active", x === b));
    layout();
  };
  $("anchor").appendChild(b);
}
document.querySelectorAll("[data-ratio]").forEach((b) => b.addEventListener("click", () => {
  expand.ratio = b.dataset.ratio;
  document.querySelectorAll("[data-ratio]").forEach((x) => x.classList.toggle("active", x === b));
  zoom = 1; layout();
}));
document.querySelectorAll("[data-ext]").forEach((b) => b.addEventListener("click", () => {
  expand.ext = b.dataset.ext;
  document.querySelectorAll("[data-ext]").forEach((x) => x.classList.toggle("active", x === b));
  renderBackground();
}));
let padTimer;
$("pad").addEventListener("input", () => {
  expand.pad = +$("pad").value;
  clearTimeout(padTimer); padTimer = setTimeout(layout, 60);
});
$("expandReset").onclick = resetExpand;
$("expandBtn").onclick = () => {
  const open = $("expandPanel").classList.toggle("open");
  $("expandBtn").classList.toggle("active", open);
  applyZoom();
};
function selectBgButton(btn) {
  document.querySelectorAll(".bottombar [data-bg]").forEach((b) => b.classList.toggle("active", b === btn));
}
document.querySelectorAll(".bottombar [data-bg]").forEach((b) => b.addEventListener("click", (e) => {
  const t = b.dataset.bg;
  if (t === "custom") return; // handled by the color input
  if (t === "photo") { $("bgFile").click(); return; }
  bg = t === "color" ? { type: "color", color: b.dataset.color } : { type: t };
  selectBgButton(b); renderBackground();
}));
const onColor = () => {
  bg = { type: "color", color: $("bgColor").value };
  $("bgColorSwatch").style.background = $("bgColor").value;
  selectBgButton($("bgColorSwatch")); renderBackground();
};
$("bgColor").addEventListener("input", onColor);
$("bgColor").addEventListener("change", onColor);
$("bgFile").addEventListener("change", async () => {
  const f = $("bgFile").files[0]; if (!f) return;
  bgPhoto = await loadFile(f);
  bg = { type: "photo" };
  selectBgButton(document.querySelector('[data-bg="photo"]')); renderBackground();
  $("bgFile").value = "";
});

// ---------- History ----------
function snapshot() {
  const c = document.createElement("canvas");
  c.width = canvas.width; c.height = canvas.height;
  c.getContext("2d").drawImage(canvas, 0, 0);
  return c;
}
function restoreFrom(s) { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(s.c, 0, 0); removed = s.removed; }
const state = () => ({ c: snapshot(), removed });
function pushUndo() {
  undoStack.push(state());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0; updateHistoryButtons();
}
function undo() { if (!undoStack.length) return; redoStack.push(state()); restoreFrom(undoStack.pop()); updateHistoryButtons(); afterEdit(); }
function redo() { if (!redoStack.length) return; undoStack.push(state()); restoreFrom(redoStack.pop()); updateHistoryButtons(); afterEdit(); }
// Backgrounds built from the photo's background need refreshing after the cutout changes
let editTimer;
function afterEdit() {
  const grown = doc.w !== canvas.width || doc.h !== canvas.height;
  if (bg.type === "blur" || (bg.type === "original" && grown)) {
    clearTimeout(editTimer); editTimer = setTimeout(renderBackground, 150);
  }
}
function updateHistoryButtons() { $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length; }
$("undo").onclick = undo; $("redo").onclick = redo;
document.addEventListener("keydown", (e) => {
  if (!original || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (e.ctrlKey || e.metaKey || e.altKey) return;
  else if (k === "e") setTool("erase");
  else if (k === "m") setTool("magic");
  else if (k === "r") setTool("restore");
  else if (k === "c") setCompare(true);
  else if (k === " ") { e.preventDefault(); setTool("move"); }
  else if (k === "[") { $("size").value = +$("size").value - 4; }
  else if (k === "]") { $("size").value = +$("size").value + 4; }
});
document.addEventListener("keyup", (e) => { if (e.key.toLowerCase() === "c") setCompare(false); });

// ---------- Brush (erase / restore with soft edges) ----------
const dabCanvas = document.createElement("canvas"), dabCtx = dabCanvas.getContext("2d");

function brushGradient(c, cx, cy, r) {
  const soft = +$("soft").value / 100;
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(Math.max(0, 1 - soft), "rgba(0,0,0,1)");
  g.addColorStop(1, soft ? "rgba(0,0,0,0)" : "rgba(0,0,0,1)");
  return g;
}
function dab(x, y, r) {
  if (tool === "erase") {
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = brushGradient(ctx, x, y, r);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (tool === "restore") {
    // Cut a round (soft-edged) piece of the original photo and lay it on top
    const ox = Math.floor(x - r), oy = Math.floor(y - r), size = Math.ceil(r * 2) + 2;
    if (dabCanvas.width !== size) { dabCanvas.width = dabCanvas.height = size; }
    dabCtx.globalCompositeOperation = "copy";
    dabCtx.clearRect(0, 0, size, size);
    dabCtx.drawImage(original, -ox, -oy);
    dabCtx.globalCompositeOperation = "destination-in";
    dabCtx.fillStyle = brushGradient(dabCtx, x - ox, y - oy, r);
    dabCtx.beginPath(); dabCtx.arc(x - ox, y - oy, r, 0, Math.PI * 2); dabCtx.fill();
    ctx.drawImage(dabCanvas, ox, oy);
  }
}

// ---------- Magic eraser (flood fill by color) ----------
function magicErase(px, py) {
  const w = canvas.width, h = canvas.height;
  const x0 = Math.floor(px), y0 = Math.floor(py);
  if (x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const seed = (y0 * w + x0) * 4;
  if (d[seed + 3] === 0) { toast("That spot is already transparent"); return; }
  const sr = d[seed], sg = d[seed + 1], sb = d[seed + 2];
  const lim = (+$("tol").value / 100) * 441.7, lim2 = lim * lim;
  const seen = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  let sp = 0, count = 0;
  stack[sp++] = y0 * w + x0; seen[y0 * w + x0] = 1;
  while (sp) {
    const p = stack[--sp], i = p * 4;
    d[i + 3] = 0; count++;
    const x = p % w;
    const nbrs = [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w];
    for (const n of nbrs) {
      if (n < 0 || n >= w * h || seen[n]) continue;
      seen[n] = 1;
      const j = n * 4;
      if (d[j + 3] === 0) continue;
      const dr = d[j] - sr, dg = d[j + 1] - sg, db = d[j + 2] - sb;
      if (dr * dr + dg * dg + db * db <= lim2) stack[sp++] = n;
    }
  }
  pushUndo();
  ctx.putImageData(img, 0, 0);
  afterEdit();
  toast(count < 50 ? "Only a few pixels matched. Try a higher tolerance" : "Erased");
}

// ---------- Pointer handling ----------
let painting = false, last = null, panStart = null;
const pointers = new Map();
let pinch = null;

function toImage(e) {
  const r = canvas.getBoundingClientRect();
  const scale = canvas.width / r.width;
  return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * scale, scale };
}
function brushRadius(scale) { return (+$("size").value / 2) * scale; }

function strokeTo(p) {
  const r = brushRadius(p.scale);
  if (!last) { dab(p.x, p.y, r); last = p; return; }
  const dx = p.x - last.x, dy = p.y - last.y, dist = Math.hypot(dx, dy);
  const step = Math.max(1, r / 4);
  if (dist < step) return;
  let d = step;
  for (; d <= dist; d += step) dab(last.x + (dx * d) / dist, last.y + (dy * d) / dist, r);
  const t = (d - step) / dist;
  last = { x: last.x + dx * t, y: last.y + dy * t, scale: p.scale };
}

function moveCursor(e) {
  if ((tool !== "erase" && tool !== "restore") || e.pointerType === "touch") { cursorEl.style.display = "none"; return; }
  const s = +$("size").value;
  Object.assign(cursorEl.style, {
    display: "block", width: s + "px", height: s + "px",
    left: e.clientX - s / 2 + "px", top: e.clientY - s / 2 + "px",
  });
}

wrap.addEventListener("pointerdown", (e) => {
  wrap.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // two fingers = pinch zoom / pan, cancel any stroke in progress
  if (pointers.size === 2) {
    if (painting) { painting = false; last = null; undo(); redoStack.length = 0; updateHistoryButtons(); }
    const [a, b] = [...pointers.values()];
    pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
    return;
  }
  if (tool === "move" || e.button === 1) {
    panStart = { x: e.clientX, y: e.clientY, sl: stage.scrollLeft, st: stage.scrollTop };
    return;
  }
  if (e.button !== 0) return;
  if (tool === "magic") { const p = toImage(e); magicErase(p.x, p.y); return; }
  pushUndo();
  painting = true; last = null;
  strokeTo(toImage(e));
});
wrap.addEventListener("pointermove", (e) => {
  moveCursor(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    setZoom(pinch.zoom * (d / pinch.dist), pinch.mid);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    stage.scrollLeft -= mid.x - pinch.mid.x; stage.scrollTop -= mid.y - pinch.mid.y;
    pinch.mid = mid;
    return;
  }
  if (panStart) {
    stage.scrollLeft = panStart.sl - (e.clientX - panStart.x);
    stage.scrollTop = panStart.st - (e.clientY - panStart.y);
    return;
  }
  if (painting) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of evs) strokeTo(toImage(ce));
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (painting) afterEdit();
  painting = false; last = null; panStart = null;
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", () => { cursorEl.style.display = "none"; });

// ---------- Export ----------
function outputCanvas() {
  const grown = doc.w !== canvas.width || doc.h !== canvas.height;
  if (bg.type === "transparent" && !grown) return canvas;
  const c = makeCanvas(doc.w, doc.h), x = c.getContext("2d");
  if (bg.type === "color") { x.fillStyle = bg.color; x.fillRect(0, 0, c.width, c.height); }
  else if (bg.type !== "transparent") x.drawImage(bgView, 0, 0);
  x.drawImage(canvas, doc.ox, doc.oy);
  return c;
}
const outName = () => {
  const grown = doc.w !== canvas.width || doc.h !== canvas.height;
  const tag = removed ? (bg.type === "transparent" ? "no-bg" : bg.type === "original" ? "edited" : "new-bg") : "edited";
  return `${fileBase}-${tag}${grown ? "-expanded" : ""}.png`;
};
function getBlob() { return new Promise((r) => outputCanvas().toBlob(r, "image/png")); }
$("downloadBtn").onclick = async () => {
  const blob = await getBlob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = outName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
// On phones, the share sheet lets you "Save Image" straight to Photos/Gallery
if (navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })) {
  $("shareBtn").style.display = "";
  $("shareBtn").onclick = async () => {
    const file = new File([await getBlob()], outName(), { type: "image/png" });
    try { await navigator.share({ files: [file] }); } catch (err) { if (err.name !== "AbortError") alert(err.message); }
  };
}
</script>
</body>
